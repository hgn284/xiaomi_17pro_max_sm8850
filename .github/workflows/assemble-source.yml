name: Assemble source release asset (transfer only)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: source-asset-9838
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: os44-qpace-force-9838
      SOURCE_FILE: OS44_FORCE_9838_source.tar.gz
      SOURCE_SHA: 173e6dc95b5e4228d07d307cd0a0f867fdb7a9648c933e52a1a95d51fd52c07e
    steps:
      - name: Assemble uploaded byte ranges
        shell: bash
        run: |
          set -euo pipefail
          mkdir incoming
          gh release download "$RELEASE_TAG" --pattern "$SOURCE_FILE.part-*" --dir incoming
          shopt -s nullglob
          parts=(incoming/"$SOURCE_FILE".part-*)
          [ "${#parts[@]}" -eq 16 ]
          cat "${parts[@]}" > "$SOURCE_FILE"
          printf '%s  %s\n' "$SOURCE_SHA" "$SOURCE_FILE" | sha256sum --check
          gh release upload "$RELEASE_TAG" "$SOURCE_FILE" --clobber
      - name: Remove temporary transfer parts
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > release.json
          jq -r --arg prefix "$SOURCE_FILE.part-" '.assets[] | select(.name | startswith($prefix)) | .id' release.json > part-ids.txt
          while read -r asset_id; do
            gh api --method DELETE "repos/$GH_REPO/releases/assets/$asset_id"
          done < part-ids.txt
